services:
  rabbitmq:
    image: 'rabbitmq:4-management'
    restart: always
    profiles:
      - "production"
      - "local"
    env_file:
      - .env.production
      - .env.local
    ports:
      - '15672:15672'
      - '5672:5672'

  database:
    image: 'postgres:17.5'
    restart: always
    profiles:
      - "local"
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Use container 'database' as Host for PgAdmin
  database-viewer:
    image: 'dpage/pgadmin4:9.4'
    restart: always
    profiles:
      - "local"
    env_file:
      - .env.local
    ports:
      - "5050:80"


volumes:
  pgdata:
