services:
  rabbitmq:
    image: 'rabbitmq:4-management'
    restart: always
    profiles:
      - "production"
      - "local"
    env_file:
      - .env.production
      - .env.local
    ports:
      - '15672:15672'
      - '5672:5672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  database:
    image: 'postgres:18.0'
    restart: always
    profiles:
      - "local"
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql

  # Use container 'database' as Host for PgAdmin
  database-viewer:
    image: 'dpage/pgadmin4:9.8.0'
    restart: always
    profiles:
      - "local"
    env_file:
      - .env.local
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database

volumes:
  pg_data:
  pgadmin_data:
  rabbitmq_data: