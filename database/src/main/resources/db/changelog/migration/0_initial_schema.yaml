databaseChangeLog:
  - changeSet:
      id: 0
      author: gross
      changes:
        - createTable:
            tableName: themes
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_themes
                    unique: true
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: int
                  constraints:
                    nullable: true
        - createTable:
            tableName: sets
            columns:
              - column:
                  name: set_num
                  type: varchar(20)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_sets
                    unique: true
              - column:
                  name: name
                  type: varchar(256)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: theme_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: num_parts
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: img_url
                  type: varchar(256)
                  constraints:
                    nullable: true
        - createTable:
            tableName: parts
            columns:
              - column:
                  name: part_num
                  type: varchar(20)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_parts
                    unique: true
              - column:
                  name: name
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: part_cat_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: part_material
                  type: varchar(256)
                  constraints:
                    nullable: false
        - createTable:
            tableName: part_relationships
            columns:
              - column:
                  name: rel_type
                  type: varchar(1)
                  constraints:
                    nullable: false
              - column:
                  name: child_part_num
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: parent_part_num
                  type: varchar(20)
                  constraints:
                    nullable: false
        - createTable:
            tableName: part_categories
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_part_categories
                    unique: true
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
        - createTable:
            tableName: minifigs
            columns:
              - column:
                  name: fig_num
                  type: varchar(20)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_minifigs
                    unique: true
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: num_parts
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: img_url
                  type: varchar(256)
                  constraints:
                    nullable: true
        - createTable:
            tableName: inventory_sets
            columns:
              - column:
                  name: inventory_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: set_num
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
        - createTable:
            tableName: inventory_parts
            columns:
              - column:
                  name: inventory_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: part_num
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: color_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: is_spare
                  type: bool
                  constraints:
                    nullable: false
              - column:
                  name: img_url
                  type: varchar(256)
                  constraints:
                    nullable: true
        - createTable:
            tableName: inventory_minifigs
            columns:
              - column:
                  name: inventory_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: fig_num
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
        - createTable:
            tableName: inventories
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_inventories
                    unique: true
              - column:
                  name: version
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: set_num
                  type: varchar(20)
                  constraints:
                    nullable: false
        - createTable:
            tableName: elements
            columns:
              - column:
                  name: element_id
                  type: varchar(10)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_elements
                    unique: true
              - column:
                  name: part_num
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: color_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: design_id
                  type: varchar(10)
                  constraints:
                    nullable: true
        - createTable:
            tableName: colors
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_colors
                    unique: true
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: rgb
                  type: varchar(6)
                  constraints:
                    nullable: false
              - column:
                  name: is_trans
                  type: bool
                  constraints:
                    nullable: false
              - column:
                  name: num_parts
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: num_sets
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: y1
                  type: int
                  constraints:
                    nullable: true
              - column:
                  name: y2
                  type: int
                  constraints:
                    nullable: true

  - changeSet:
      id: 1
      author: gross
      changes:
        - loadData:
            file: classpath:/db/changelog/data/themes.csv
            tableName: themes
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/sets.csv
            tableName: sets
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/parts.csv
            tableName: parts
            separator: ","
            quotchar: '"'
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/part_relationships.csv
            tableName: part_relationships
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/part_categories.csv
            tableName: part_categories
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/minifigs.csv
            tableName: minifigs
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/inventory_sets.csv
            tableName: inventory_sets
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/inventory_parts.csv
            tableName: inventory_parts
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/inventory_minifigs.csv
            tableName: inventory_minifigs
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/inventories.csv
            tableName: inventories
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/elements.csv
            tableName: elements
            separator: ","
            encoding: UTF-8
        - loadData:
            file: classpath:/db/changelog/data/colors.csv
            tableName: colors
            separator: ","
            encoding: UTF-8
  - changeSet:
      id: 2
      author: gross
      changes:
        # Themes Foreign keys ( parent_id )
        - addForeignKeyConstraint:
            baseColumnNames: parent_id
            baseTableName: themes
            baseTableSchemaName: public
            constraintName: fk_themes_themes
            referencedColumnNames: id
            referencedTableName: themes
            referencedTableSchemaName: public
            validate: true
        # Sets Foreign Keys ( theme_id )
        - addForeignKeyConstraint:
            baseColumnNames: theme_id
            baseTableName: sets
            baseTableSchemaName: public
            constraintName: fk_sets_themes
            referencedColumnNames: id
            referencedTableName: themes
            referencedTableSchemaName: public
            validate: true
        # Inventory Sets Foreign Keys ( inventory_id, set_num )
        - addForeignKeyConstraint:
            baseColumnNames: inventory_id
            baseTableName: inventory_sets
            baseTableSchemaName: public
            constraintName: fk_inventory_sets_inventories
            referencedColumnNames: id
            referencedTableName: inventories
            referencedTableSchemaName: public
            validate: true
        - addForeignKeyConstraint:
            baseColumnNames: set_num
            baseTableName: inventory_sets
            baseTableSchemaName: public
            constraintName: fk_inventory_sets_sets
            referencedColumnNames: set_num
            referencedTableName: sets
            referencedTableSchemaName: public
            validate: true
        # Inventories Foreign Keys ( set_num )
        - addForeignKeyConstraint:
            baseColumnNames: set_num
            baseTableName: inventories
            baseTableSchemaName: public
            constraintName: fk_inventories_sets
            referencedColumnNames: set_num
            referencedTableName: sets
            referencedTableSchemaName: public
            validate: true
        # Inventory Minifigs Foreign Keys ( inventory_id, fig_num )
        - addForeignKeyConstraint:
            baseColumnNames: inventory_id
            baseTableName: inventory_minifigs
            baseTableSchemaName: public
            constraintName: fk_inventory_minifigs_inventories
            referencedColumnNames: id
            referencedTableName: inventories
            referencedTableSchemaName: public
            validate: true
        - addForeignKeyConstraint:
            baseColumnNames: fig_num
            baseTableName: inventory_minifigs
            baseTableSchemaName: public
            constraintName: fk_inventory_minifigs_minifigs
            referencedColumnNames: fig_num
            referencedTableName: minifigs
            referencedTableSchemaName: public
            validate: true
        # Inventory Parts Foreign Keys ( inventory_id, part_num, color_id )
        - addForeignKeyConstraint:
            baseColumnNames: inventory_id
            baseTableName: inventory_parts
            baseTableSchemaName: public
            constraintName: fk_inventory_parts_inventories
            referencedColumnNames: id
            referencedTableName: inventories
            referencedTableSchemaName: public
            # FIXME, seems like a lot of bad data in this table
            validate: false
        - addForeignKeyConstraint:
            baseColumnNames: part_num
            baseTableName: inventory_parts
            baseTableSchemaName: public
            constraintName: fk_inventory_parts_parts
            referencedColumnNames: part_num
            referencedTableName: parts
            referencedTableSchemaName: public
            validate: true
        - addForeignKeyConstraint:
            baseColumnNames: color_id
            baseTableName: inventory_parts
            baseTableSchemaName: public
            constraintName: fk_inventory_parts_colors
            referencedColumnNames: id
            referencedTableName: colors
            referencedTableSchemaName: public
            validate: true
        # Parts Foreign Keys ( part_cat_id )
        - addForeignKeyConstraint:
            baseColumnNames: part_cat_id
            baseTableName: parts
            baseTableSchemaName: public
            constraintName: fk_parts_part_categories
            referencedColumnNames: id
            referencedTableName: part_categories
            referencedTableSchemaName: public
            validate: true
        # Part Relationships Foreign Keys ( child_part_num, parent_part_num )
        - addForeignKeyConstraint:
            baseColumnNames: child_part_num
            baseTableName: part_relationships
            baseTableSchemaName: public
            constraintName: fk_child_part_relationships_parts
            referencedColumnNames: part_num
            referencedTableName: parts
            referencedTableSchemaName: public
            validate: true
        - addForeignKeyConstraint:
            baseColumnNames: parent_part_num
            baseTableName: part_relationships
            baseTableSchemaName: public
            constraintName: fk_parent_part_relationships_parts
            referencedColumnNames: part_num
            referencedTableName: parts
            referencedTableSchemaName: public
            validate: true
        # Elements Foreign Keys( part_num, color_id )
        - addForeignKeyConstraint:
            baseColumnNames: part_num
            baseTableName: elements
            baseTableSchemaName: public
            constraintName: fk_elements_parts
            referencedColumnNames: part_num
            referencedTableName: parts
            referencedTableSchemaName: public
            validate: true
        - addForeignKeyConstraint:
            baseColumnNames: color_id
            baseTableName: elements
            baseTableSchemaName: public
            constraintName: fk_elements_colors
            referencedColumnNames: id
            referencedTableName: colors
            referencedTableSchemaName: public
            validate: true
