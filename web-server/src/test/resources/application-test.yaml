spring:
  application:
    name: "LessLGEO"
  rabbitmq:
    host: "localhost"
    port: 5672
    listener:
      simple:
        default-requeue-rejected: false
  datasource:
    driverClassName: "org.postgresql.Driver"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

rabbit:
  exchange:
    web-to-parser-exchange: "web-to-parser-exchange"
    parser-to-reducer-exchange: "parser-to-reducer-exchange"
  worker-queue:
    parser-to-reducer: "parser-to-reducer-queue"
  rpc:
    web-to-parser:
      name: "web-to-parser-rpc"
      reply-timeout: PT5M
  dead-letter:
    dead-letter-exchange: "dead-letter-exchange"
    web-to-parser-dead-letter-queue: "web-to-parser-dead-letter-queue"
    parser-to-reducer-dead-letter-queue: "parser-to-reducer-dead-letter-queue"
    web-to-parser-routing-key: "web.parser.dlq"
    parser-to-reducer-routing-key: "parser.reducer.dlq"

zonky:
  test:
    database:
      type: auto                        # The type of embedded database to be created when replacing the data source.
      provider: default                 # Provider to be used to create the underlying embedded database.
      refresh: after-each-test-method   # Determines the refresh mode of the embedded database.
      replace: any                      # Determines what type of existing DataSource beans can be replaced.
      postgres:
        docker:
          image: postgres:18.0          # Docker image containing PostgreSQL database.
