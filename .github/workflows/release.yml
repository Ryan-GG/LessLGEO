name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version'
        required: true
        type: string
      developmentVersion:
        description: 'Next development version'
        required: true
        type: string

jobs:
  maven-release:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v5
        with:
          lfs: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: 'Set up JDK 25'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: 'x64'
          cache: 'maven'
          server-id: 'github'  # Must match <id> in your pom.xml <distributionManagement>
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up GitHub credentials
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com" > ~/.git-credentials

      - name: Maven Release Prepare
        run: |
          mvn release:prepare -B \
            -DreleaseVersion=${{ inputs.releaseVersion }} \
            -DdevelopmentVersion=${{ inputs.developmentVersion }} \
            -Dtag=v${{ inputs.releaseVersion }}

      - name: Maven Release Perform
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: mvn release:perform -B

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.releaseVersion }}
          generate_release_notes: true
          files: |
            **/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}