on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_ui:
    name: Compile UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Generate Proto Sources
        run: npm run generate-sources

      - name: Compile Typescript
        run: npm run type-check

      - name: Lint
        run: npm run lint

  build_java:
    name: Compile Maven
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          architecture: x64
          cache: maven
            
            # FIX: Remove any corrupted mockito-core artifact before the build
                   - name: Delete corrupted mockito-core jar (if present)
                   run: rm -rf ~/.m2/repository/org/mockito/mockito-core
                     
                     # FIX: Make sure dependencies are present before the agent is needed
                     - name: Resolve Maven dependencies
                       run: mvn dependency:resolve

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Upload Maven Artifacts
        run: |
          mkdir -p staging
          cp target/*.jar staging
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging
          retention-days: 5
