on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # UI Build Job
  build_ui:
    name: Compile UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install NPM Dependencies
        run: npm install

  # Java Build Job
  build_java:
    name: Compile Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
      - name: Build with Maven
        run: mvn clean install
