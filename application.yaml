spring:
  application:
    name: "LessLGEO"
  rabbitmq:
    host: "localhost"
    port: 5672
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false
  datasource:
    driverClassName: "org.postgresql.Driver"
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}

rabbit:
  exchange:
    web-to-parser-exchange: "web-to-parser-exchange"
    parser-to-reducer-exchange: "parser-to-reducer-exchange"
  worker-queue:
    web-to-parser: "web-to-parser-queue"
    parser-to-reducer: "parser-to-reducer-queue"
  dead-letter:
    dead-letter-exchange: "dead-letter-exchange"
    web-to-parser-dead-letter-queue: "web-to-parser-dead-letter-queue"
    parser-to-reducer-dead-letter-queue: "parser-to-reducer-dead-letter-queue"
    web-to-parser-routing-key: "web.parser.dlq"
    parser-to-reducer-routing-key: "parser.reducer.dlq"

---
spring:
  config:
    activate:
      on-profile: "production"
    # The [.properties] is a hint for spring which translates to
    # “Use this file without an extension as a .properties file.”
    import: "optional:file:.env.production[.properties]"
  docker:
    compose:
      enabled: true
      file: "compose.yaml"
      profiles:
        active: "production"

---
spring:
  config:
    activate:
      on-profile: local
    # The [.properties] is a hint for spring which translates to
    # “Use this file without an extension as a .properties file.”
    import: "optional:file:.env.local[.properties]"
  docker:
    compose:
      enabled: true
      file: "compose.yaml"
      profiles:
        active: "local"
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      org.hibernate.SQL: debug
      org.hibernate.type.descriptor.sql.BasicBinder: trace



