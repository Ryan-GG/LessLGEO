spring:
  application:
    name: LessLGEO
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/
    username: { DATABASE_USER }
    password: { DATABASE_PASSWORD }


rabbit:
  worker-queues:
    web-to-parser: "web-to-parser-queue"
    parser-to-reducer: "parser-to-reducer-queue"

