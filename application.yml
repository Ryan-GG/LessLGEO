spring:
  application:
    name: LessLGEO
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/color?currentSchema=color
    username: { DATABASE_USER }
    password: { DATABASE_PASSWORD }


rabbit:
  parserToReducerTopic: "parser-to-reducer-exchange"
  parserToReducerQueue: "parser-to-reducer-queue"
  parserToReducerRoutingKey: "parser.reducer.#"
  webToParserTopic: "web-to-parser-exchange"
  webToParserQueue: "web-to-parser-queue"
  webToParserRoutingKey: "web.parser.#"